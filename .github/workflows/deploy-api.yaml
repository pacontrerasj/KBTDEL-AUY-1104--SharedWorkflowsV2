name: Deploy API (Pro)

on:
  workflow_call:
    inputs:
      image-name:
        description: Nombre de la imagen
        required: true
        type: string

      image-tag:
        description: Tag de la imagen 
        required: true
        type: string

    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if [[ ! "${{ inputs.image-tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo " Invalid tag format. Use v1.0.0"
            exit 1
          fi

      - name: Check Dockerfile exists
        run: |
          if [ ! -f Dockerfile ]; then
            echo " Dockerfile not found"
            exit 1
          fi

      - name: Show build info
        run: |
          echo "User: ${{ secrets.DOCKER_USERNAME }}"
          echo "Image: ${{ inputs.image-name }}"
          echo "Tag: ${{ inputs.image-tag }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}"

          echo "Building image: $IMAGE"

          docker build \
            -t "$IMAGE:${{ inputs.image-tag }}" \
            -t "$IMAGE:latest" \
            .

          docker push --all-tags "$IMAGE"
name: Subir la API a Docker Hub (receta reutilizable)

on:
  workflow_call:
    inputs:
      image-name:
        description: Nombre de la imagen en Docker Hub (sin usuario)
        required: true
        type: string
      image-tag:
        description: Etiqueta de versión
        required: true
        type: string
      k3s-server-public-ip:
        description: IP pública del servidor k3s en AWS
        required: true
        type: string
      app-port:
        description: Puerto NodePort donde se expone la app
        required: false
        type: string
        default: "30090"
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      EA2_SSH_PRIVATE_KEY:
        required: true

  workflow_dispatch:
    inputs:
      image-name:
        description: Nombre corto de la imagen
        required: true
        type: string
      image-tag:
        description: Etiqueta (ej. v1.0.0)
        required: true
        type: string
      k3s-server-public-ip:
        description: IP pública del servidor k3s
        required: true
        type: string
      app-port:
        description: Puerto NodePort
        required: false
        type: string
        default: "30090"

jobs:
  deps-and-test:
    name: Dependencies and tests
    runs-on: ubuntu-latest
    steps:
      - name: 1 · Descargar el código
        uses: actions/checkout@v4

      - name: 2 · Instalar dependencias
        run: npm install

      - name: 3 · Ejecutar tests
        run: npm test

  build-and-push:
    name: Build and push Docker image
    needs: deps-and-test
    runs-on: ubuntu-latest
    steps:
      - name: 1 · Descargar el código
        uses: actions/checkout@v4

      - name: 2 · Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 3 · Build y push
        run: |
          IMAGEN_COMPLETA="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}"
          docker build \
            -t "${IMAGEN_COMPLETA}:${{ inputs.image-tag }}" \
            -t "${IMAGEN_COMPLETA}:latest" \
            .
          docker push --all-tags "${IMAGEN_COMPLETA}"

  deploy-to-k8s:
    name: Deploy to AWS K3S
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - name: 1 · Verificar conexión SSH
        run: ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" 'echo "Conexión OK"'

      - name: Checkout para obtener manifiestos k8s/
        uses: actions/checkout@v4

      - name: 2 · Copiar manifiestos y aplicar
        run: |
          set -euo pipefail
          test -d k8s || { echo "::error::Falta carpeta k8s/ en la raíz del repo"; exit 1; }
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" \
            'sudo rm -rf /tmp/k8s-deploy'
          scp -o StrictHostKeyChecking=accept-new -r k8s \
            "ubuntu@${{ inputs.k3s-server-public-ip }}:/tmp/k8s-deploy"
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" \
            'sudo k3s kubectl apply -f /tmp/k8s-deploy/'

      - name: 3 · Verificar pods
        run: |
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" \
            'sudo k3s kubectl get pods -o wide'

      - name: 4 · Verificar endpoint /health
        run: |
          sleep 10
          curl -f "http://${{ inputs.k3s-server-public-ip }}:${{ inputs.app-port }}/health" \
            && echo "Servicio OK" || echo "Advertencia: endpoint no respondió aún"
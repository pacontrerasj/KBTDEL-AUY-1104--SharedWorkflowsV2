name: Deploy API (Pro)

on:
  workflow_call:
    inputs:
      image-name:
        description: Nombre de la imagen
        required: true
        type: string

      image-tag:
        description: Tag de la imagen
        required: true
        type: string

    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}"

          echo "Building image: $IMAGE"

          docker build \
            -t "$IMAGE:${{ inputs.image-tag }}" \
            -t "$IMAGE:latest" \
            .

          docker push --all-tags "$IMAGE"
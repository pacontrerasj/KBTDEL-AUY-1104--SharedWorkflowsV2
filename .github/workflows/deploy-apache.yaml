name: Subir Apache a Docker Hub (receta reutilizable)

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      k3s-server-public-ip:
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      EA2_SSH_PRIVATE_KEY:
        required: true

  workflow_dispatch:
    inputs:
      image-name:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      k3s-server-public-ip:
        required: true
        type: string

jobs:
  build-and-push:
    name: Build and push Apache image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build y push
        run: |
          IMAGEN="${{ secrets.DOCKER_USERNAME }}/${{ inputs.image-name }}"
          docker build -t "${IMAGEN}:${{ inputs.image-tag }}" -t "${IMAGEN}:latest" .
          docker push --all-tags "${IMAGEN}"

  deploy-to-k8s:
    name: Deploy Apache to K3S
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EA2_SSH_PRIVATE_KEY }}

      - uses: actions/checkout@v4

      - name: Copiar manifiestos y aplicar
        run: |
          set -euo pipefail
          test -d k8s || { echo "::error::Falta carpeta k8s/"; exit 1; }
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" \
            'sudo rm -rf /tmp/k8s-apache'
          scp -o StrictHostKeyChecking=accept-new -r k8s \
            "ubuntu@${{ inputs.k3s-server-public-ip }}:/tmp/k8s-apache"
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" \
            'sudo k3s kubectl apply -f /tmp/k8s-apache/'

      - name: Verificar pods
        run: |
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ inputs.k3s-server-public-ip }}" \
            'sudo k3s kubectl get pods -o wide'

      - name: Verificar endpoint Apache
        run: |
          sleep 10
          curl -f "http://${{ inputs.k3s-server-public-ip }}:30100" \
            && echo "Apache OK" || echo "Advertencia: no respondió aún"